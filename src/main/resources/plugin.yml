name: ScheduledCommands
version: '${project.version}'
main: uk.globeworks.scheduledcommands.ScheduledCommandsPlugin
api-version: '1.21'
description: Run console commands on cron schedules, player join, and Globeworks history events.
author: Globeworks UK
softdepend: [GlobeworksAPI]

commands:
  schedcmds:
    description: Manage and test scheduled commands
    usage: /schedcmds <reload|list|test> [schedule]
    permission: schedcmds.reload
    aliases: [scheduledcommands]

permissions:
  schedcmds.reload:
    description: Allows reloading the schedule config
    default: op
  schedcmds.list:
    description: Allows listing loaded schedules
    default: op
  schedcmds.test:
    description: Allows manually running a schedule for testing
    default: op